{% extends "base.html" %}
{% block content %}
<section class="narrow">
  <h1>{{ heading }}</h1>
  <form method="post" class="stack">
    <label>Title
      <input type="text" name="title" maxlength="150" required
             value="{{ post['title'] if post else '' }}">
    </label>
    <label>Content
      <textarea name="content" rows="14" required>{{ post['content'] if post else '' }}</textarea>
    </label>
    <p class="hint">Separate paragraphs with a blank line.</p>
    <button class="button primary" type="submit">{{ button }}</button>
  </form>
</section>
{% endblock %}
